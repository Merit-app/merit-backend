name: Regenerate lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.npmrc'

jobs:
  regen:
    runs-on: ubuntu-latest
    # Skip if this commit was already made by the bot
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile for Linux
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: regenerate package-lock.json for Linux (no win32 binaries)" && \
            git push
